name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No workflow-level permissions: each job asks for the least it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only: configure-pages queries the Pages settings of the repository.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fails early, with a clear message, when Pages is not enabled with
      # "GitHub Actions" as its source (see README, "Deployment").
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Reads the pnpm version from the "packageManager" field of package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust (stable, wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Test Rust crate
        run: cargo test --manifest-path crates/field/Cargo.toml

      # `pnpm build` runs this too, but finds the output up to date and skips.
      # Kept as its own step so a Rust failure is easy to spot in the log.
      - name: Build WASM
        run: pnpm run build:wasm

      - name: Build site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
